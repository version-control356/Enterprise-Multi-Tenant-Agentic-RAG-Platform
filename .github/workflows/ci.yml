name: CI / Quality & Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources (Syntax Check)
        run: python -m compileall -q app frontend tests

      - name: Run Test Suite
        run: python -m pytest -v tests/

      - name: Dependency Consistency Check
        run: python -m pip check

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Build Docker image for verification
        run: docker build -t multi-tenant-rag:test .

      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: multi-tenant-rag:test
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

