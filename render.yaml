services:
  - type: web
    name: enterprise-multi-tenant-agentic-rag
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUIRE_REDIS
        value: "true"
      - key: PII_PROVIDER
        value: presidio
      - key: PROMPT_GUARDRAILS_PROVIDER
        value: nemo
      - key: NEMO_CHECK_MODE
        value: suspicious
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin_user
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_TENANT_ID
        value: tenant_alpha
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com

  - type: web
    name: enterprise-rag-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: enterprise-multi-tenant-agentic-rag
          property: host
      - key: PORT
        value: "8501"
