apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag-platform
  labels:
    app: rag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ghcr.io/your-org/multi-tenant-agentic-rag-platform:latest
          command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: API_BASE_URL
              value: "http://backend-service.rag-platform.svc.cluster.local:8000/api/v1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: rag-platform
spec:
  selector:
    app: rag-frontend
  ports:
    - port: 8501
      targetPort: 8501
      name: http
